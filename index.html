<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Personal Site Landing Page</title>
        <link rel="stylesheet", href="css/style.css" />        
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script defer src="js/navbar.js"></script>
        <script 
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>

    </head>
    <body>
        <my-navbar></my-navbar>
        <main>
         <h1 class="text-center m-4">About</h1>
         <div class="main-area container d-flex">
          <div class="row align-items-center">
          <div class="col-12">
           <div class="card"
                id="index-card">
           <div class="row g-0 align-items-center">

            <div class="col-12 col-sm-8">
                <div class="card-body">
                    <h1 class="card-title">
                        Your research, turned into code.
                    </h1>
                    <h2 class="card-subtitle fst-italic">
                        Readable. Maintainable. Reproducible.
                    </h2>
                    <p class="card-text">
                        I'm a mathematician that can understand your model, and an engineer that can build it. Trained rigorously in logic and design practices, I'll bring clean results you can trust.
                    </p>
                </div>
            </div>           
            <!-- include an image that takes up a whole row on mobile screens,
            but expands and goes to the left on larger screens. -->
            <div class="col-12 col-sm-4">
             <img
              src="images/AboutMeShot.JPEG"
              class="img-thumbnail p-3 border-0 custom-about-image"
              alt="Xander Hawkins portrait smiling at the camera"
             />
            </div>
           </div>
           </div>
          </div>
          </div>
         </div>
        </main>
    </body>
</html>
