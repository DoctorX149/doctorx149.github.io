<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contact Form Page</title>
        <link rel="stylesheet", href="css/style.css" />        
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script defer src="js/navbar.js"></script>
        <script 
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>
    </head>
    <body>
        <my-navbar></my-navbar>
        <main>
            <h1 class="text-center m-4">Contact</h1>
            <h2 class="text-center fst-italic">Let's get in touch!</h2>
            <div class="container">
            <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
            <form action="https://api.web3forms.com/submit" method="POST">

                <input 
                    type="hidden" 
                    name="access_key" 
                    value="6e496ad6-6d7e-4893-8f83-366e5f226cac">
              
                <!-- Anti-spam honeypot field (hidden from users, but catches spam bots) -->
                <input 
                    type="checkbox" 
                    name="botcheck" 
                    class="hidden" 
                    style="display: none;"
                    aria-label="fake input field to catch spam bots">
                <div class="form-floating mb-1 py-1">
                <input type="text" class="form-control" id="subject" placeholder="Subject (required)" name="subject" required>
                <label for="subject">Subject</label>
                </div>

                <div class="form-floating mb-1 py-1">
                <input type="email" class="form-control" id="email" placeholder="Email (required)" name="email" required>
                <label for="email">Email Address</label>
                </div>
             
                <div class="form-floating mb-1 py-1">
                <textarea class="form-control" id="message" style="height: 200px" placeholder="Message" name="message-text" required></textarea>
                <label for="message">Message</label>
                </div>
             
                <button type="submit" class="btn-primary-custom">Submit</button>
              </form>
              </div>
              </div>
              </div>
        </main>
    </body>
</html>
